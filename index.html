<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7b5aa6">
<title>BudgetingYuk</title>
<style>
:root{
  --primary:#0f766e;--primary2:#14b8a6;--dark:#10252d;--bg:#f4f7f8;
  --card:#fff;--text:#13252d;--muted:#71808a;--line:#e4eaed;
  --danger:#dc2626;--warning:#f59e0b;--success:#16a34a;
  --shadow:0 8px 28px rgba(17,44,54,.08);--radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{
  background:linear-gradient(135deg,#10242e,#17333b);color:#fff;padding:22px max(20px,calc((100vw - 1180px)/2)) 18px;
}
.topbar-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#2dd4bf,#0f766e);display:grid;place-items:center;font-weight:900;box-shadow:0 7px 20px rgba(20,184,166,.22)}
.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:#b7c6ca;font-size:13px}
.monthbar{max-width:1180px;margin:15px auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.month-select{background:#fff;color:#183039;border:0;border-radius:13px;padding:11px 14px;font-weight:700;outline:none}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn,.ghost-btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.09);color:#fff;border-radius:12px;padding:10px 13px}
.container{max-width:1180px;margin:0 auto;padding:24px 20px 100px}
.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2,.card h3{margin:0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-title h2{font-size:18px}.section-title small{color:var(--muted)}
.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:800}
.btn-primary{background:var(--primary);color:#fff}.btn-light{background:#edf7f6;color:var(--primary)}.btn-danger{background:#fff0f0;color:var(--danger)}
.btn-sm{padding:8px 11px;font-size:13px}
.income-card{background:linear-gradient(135deg,#0d5d59,#0f766e 58%,#18a999);color:#fff;border:0}
.income-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.label{font-size:13px;color:#a8c4c3}.income-total{font-size:30px;font-weight:900;margin-top:4px}
.progress{height:9px;background:#dfe8eb;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#16bda8,#46e0b8);border-radius:99px}
.income-card .progress{background:rgba(255,255,255,.2);margin:18px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:13px;border-radius:15px;background:#f7fafb}.income-card .stat{background:rgba(255,255,255,.08)}.stat b{display:block;margin-top:4px;font-size:17px}.stat span{font-size:12px;color:var(--muted)}.income-card .stat span{color:#b8d0cf}
.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff}
.item-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.item-main{min-width:0;flex:1}.item-main b{display:block}.item-main span{font-size:12px;color:var(--muted)}.item-side{text-align:right}.item-side b{display:block}.item-side span{font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:28px;color:var(--muted);border:1px dashed #cfd9dd;border-radius:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#f5f8f9;border-radius:999px;padding:8px 12px;font-size:12px}.chip.active{background:#dff6f2;color:var(--primary);border-color:#b8e8df;font-weight:800}
.breakdown{display:grid;gap:12px}.break-row{display:grid;grid-template-columns:115px 1fr 70px;align-items:center;gap:10px;font-size:13px}.bar{height:8px;background:#e8eef0;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,#0f766e,#2dd4bf)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #d8e0e3;border-radius:13px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#5ecfc1;box-shadow:0 0 0 3px rgba(20,184,166,.1)}
.color-row{display:flex;gap:10px}.color{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d4dee1}.color.active{box-shadow:0 0 0 2px var(--primary)}
.modal{position:fixed;inset:0;background:rgba(12,25,31,.52);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.open{display:flex}.modal-box{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:#eef3f4;border-radius:10px;width:36px;height:36px}
.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{border:0;background:#f0f5f6;padding:9px 13px;border-radius:999px;color:#617079}.tab.active{background:#dff6f2;color:var(--primary);font-weight:800}
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{border:1px solid var(--line);border-radius:17px;padding:16px}.metric .big{font-size:25px;font-weight:900;margin-top:5px}.metric p{font-size:12px;color:var(--muted);margin:6px 0 0}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--primary) var(--p),#e6edef 0);position:relative;margin:auto}.donut:after{content:"";position:absolute;width:105px;height:105px;background:#fff;border-radius:50%}.donut span{position:relative;z-index:1;font-weight:900;font-size:22px}
.nav{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);width:min(650px,calc(100% - 24px));background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 10px 35px rgba(0,0,0,.12);border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:transparent;color:#71808a;border-radius:15px;padding:9px 4px;font-size:11px}.nav button.active{background:#e3f7f3;color:var(--primary);font-weight:900}.nav-icon{display:block;font-size:18px;margin-bottom:3px}
.view{display:none}.view.active{display:block}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-15px);background:#13252d;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:800px){.grid,.analysis-grid{grid-template-columns:1fr}.topbar{padding-left:16px;padding-right:16px}.container{padding:18px 14px 100px}.form-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.break-row{grid-template-columns:90px 1fr 62px}}
@media(max-width:460px){.topbar{padding-top:16px}.brand h1{font-size:18px}.brand p{font-size:11px}.monthbar{align-items:stretch;flex-direction:column}.header-actions{justify-content:flex-end}.stats{grid-template-columns:1fr}.card{padding:16px}.income-total{font-size:26px}}

/* ===== BudgetingYuk Theme: mengikuti palet karakter ===== */
:root{
  --primary:#7b5aa6;
  --primary2:#c7b6ed;
  --dark:#30282c;
  --bg:#faf7fc;
  --card:#ffffff;
  --text:#30282c;
  --muted:#766d75;
  --line:#e9e1ed;
  --danger:#c65b78;
  --warning:#e8aa42;
  --success:#5b9b84;
  --shadow:0 8px 28px rgba(80,58,92,.10);
}
.topbar{background:linear-gradient(135deg,#332b31,#59445e)}
.logo{background:linear-gradient(135deg,#c7b6ed,#a98bcf);box-shadow:0 7px 20px rgba(123,90,166,.22)}
.brand p{color:#d9cfdd}
.icon-btn,.ghost-btn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
.income-card{background:linear-gradient(135deg,#72539d,#9272bd 58%,#c28ab1)}
.income-card .progress{background:rgba(255,255,255,.22)}
.income-card .progress>i,.progress>i{background:linear-gradient(90deg,#c7b6ed,#e5a9c9)}
.btn-primary{background:#7b5aa6}
.btn-light{background:#f2ebfa;color:#72539d}
.btn-danger{background:#fff0f4;color:#c65b78}
.nav button.active{background:#f0e9f8;color:#72539d}
.chip.active{background:#eee5f8;color:#72539d;border-color:#d8c8ea}
.tab.active{background:#eee5f8;color:#72539d}
.bar i{background:linear-gradient(90deg,#7b5aa6,#c7b6ed)!important}
.donut{background:conic-gradient(#7b5aa6 var(--p),#ebe5ef 0)}
.note{color:#766d75}
.mascot-card{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,#fff,#faf6ff 58%,#f4eafa);
  border:1px solid #e7dcef;
}
.mascot-wrap{display:flex;align-items:center;gap:18px;min-height:170px}
.mascot-img{width:175px;height:175px;object-fit:cover;border-radius:50%;flex:none;box-shadow:0 12px 28px rgba(108,78,137,.16);background:#c7b6ed}
.mascot-copy h2{font-size:22px;color:#4a3855;margin:0 0 7px}
.mascot-copy p{margin:0;color:#766d75;font-size:13px;line-height:1.55}
.mascot-badge{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:999px;background:#eee5f8;color:#72539d;font-size:11px;font-weight:800}
@media(max-width:800px){.mascot-wrap{min-height:0}.mascot-img{width:130px;height:130px}}
@media(max-width:460px){.mascot-wrap{gap:12px}.mascot-img{width:105px;height:105px}.mascot-copy h2{font-size:18px}.mascot-copy p{font-size:11px}}

</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
(() => {
"use strict";

const KEY = "budgetingyuk_v1";
const COLORS = ["#0f766e","#3b82f6","#8b5cf6","#f59e0b","#ec4899","#14b8a6"];

const uid = (p="id") => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const money = n => new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Math.max(0,Number(n)||0));
const num = v => Math.max(0,Number(String(v).replace(/[^\d]/g,""))||0);
const pct = (a,b) => b > 0 ? Math.min(100,Math.round((a/b)*100)) : 0;
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const monthLabel = iso => new Intl.DateTimeFormat("id-ID",{month:"long",year:"numeric"}).format(new Date(iso+"-01T00:00:00"));

function makeMonth(iso){
  return {
    id:iso, income:0, otherIncome:[], savings:[],
    createdAt:Date.now()
  };
}
function defaultState(){
  const now = new Date();
  const iso = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const m=makeMonth(iso);
  m.income=0;
  return {activeMonth:iso,months:{[iso]:m}};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return defaultState();
    const s=JSON.parse(raw);
    if(!s.months || !s.activeMonth)return defaultState();
    Object.values(s.months).forEach(m=>{ delete m.installments; delete m.expenses; });
    return s;
  }catch(e){return defaultState();}
}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function month(){
  if(!state.months[state.activeMonth]) state.months[state.activeMonth]=makeMonth(state.activeMonth);
  const m=state.months[state.activeMonth];
  // Migrasi data lama: pastikan semua koleksi pos tersedia sebelum dipakai.
  if(!Array.isArray(m.savings))m.savings=[];
  if(!Array.isArray(m.otherIncome))m.otherIncome=[];
  if(typeof m.income!=='number')m.income=num(m.income);
  return m;
}
function totalOther(){return month().otherIncome.reduce((a,x)=>a+num(x.amount),0)}
function totalIncome(){return num(month().income)+totalOther()}
function totalSavings(){return month().savings.reduce((a,x)=>a+num(x.amount),0)}
function allocated(){return totalSavings()}
function remainingBudget(){return Math.max(0,totalIncome()-allocated())}
function usedPct(){return pct(allocated(),totalIncome())}

function iconFor(type){return ({savings:"💰",income:"💵"})[type]||"•"}
function colorFor(i){return COLORS[(i||0)%COLORS.length]}

function appShell(view="home"){
 const m=month();
 return `
 <header class="topbar">
  <div class="topbar-inner">
   <div class="brand"><div class="logo">₿</div><div><h1>BudgetingYuk</h1><p>Kelola uang, lebih tenang.</p></div></div>
   <div class="header-actions"><button class="icon-btn" data-action="add-month">＋ Bulan</button><button class="icon-btn" data-action="reset">↻ Reset</button></div>
  </div>
  <div class="monthbar">
   <select class="month-select" id="monthSelect">${Object.keys(state.months).sort().reverse().map(x=>`<option value="${x}" ${x===state.activeMonth?"selected":""}>${esc(monthLabel(x))}</option>`).join("")}</select>
   <div class="header-actions"><button class="ghost-btn" data-action="edit-income">✎ Edit Pemasukan</button></div>
  </div>
 </header>
 <main class="container">
   <section id="view-home" class="view ${view==="home"?"active":""}">${homeView(m)}</section>
   <section id="view-transactions" class="view ${view==="transactions"?"active":""}">${transactionsView(m)}</section>
   <section id="view-analysis" class="view ${view==="analysis"?"active":""}">${analysisView(m)}</section>
   <section id="view-settings" class="view ${view==="settings"?"active":""}">${settingsView(m)}</section>
 </main>
 <nav class="nav">
  <button data-view="home" class="${view==="home"?"active":""}"><span class="nav-icon">⌂</span>Beranda</button>
  <button data-view="transactions" class="${view==="transactions"?"active":""}"><span class="nav-icon">☷</span>Pos</button>
  <button data-view="analysis" class="${view==="analysis"?"active":""}"><span class="nav-icon">▥</span>Analisis</button>
  <button data-view="settings" class="${view==="settings"?"active":""}"><span class="nav-icon">⚙</span>Pengaturan</button>
 </nav>`;
}

function homeView(m){
 const inc=totalIncome(), used=usedPct();
 return `
 <div class="grid">
  <div style="display:grid;gap:20px">
   <div class="card income-card">
    <div class="income-head"><div><div class="label">Pemasukan Bulan Ini</div><div class="income-total">${money(inc)}</div></div><button class="btn" style="background:rgba(255,255,255,.12);color:#fff" data-action="edit-income">Edit</button></div>
    <div class="progress"><i style="width:${used}%"></i></div>
    <div class="stats">
      <div class="stat"><span>Sudah Dialokasikan</span><b>${money(allocated())}</b></div>
      <div class="stat"><span>Sisa Aktual</span><b>${money(remainingBudget())}</b></div>
      <div class="stat"><span>Terpakai</span><b>${used}%</b></div>
    </div>
   </div>

   <div class="card">
    <div class="section-title"><h2>💰 Tabungan</h2><button class="btn btn-light btn-sm" data-action="add-savings">＋ Tambah</button></div>
    ${m.savings.length?`<div class="list">${m.savings.map((x,i)=>itemRow(x,"savings",i)).join("")}</div>`:`<div class="empty">Belum ada pos tabungan.<br><button class="btn btn-primary btn-sm" style="margin-top:10px" data-action="add-savings">Buat Pos Tabungan</button></div>`}

  </div>

function itemRow(x,type,i){
 const amount=num(x.amount);
 const icon=x.icon||iconFor(type);
 return `<div class="item">
   <div class="item-icon" style="background:${esc(x.color||colorFor(i))}20">${icon}</div>
   <div class="item-main"><b>${esc(x.name)}</b><span>${pct(amount,totalIncome())}% dari pemasukan</span></div>
   <div class="item-side"><b>${money(amount)}</b><span>Tabungan</span></div>
   <button class="btn btn-light btn-sm" data-edit="savings" data-id="${x.id}">Edit</button>
 </div>`;
}
function incomeRow(x,i){
 return `<div class="item"><div class="item-icon" style="background:#16a34a20">💵</div><div class="item-main"><b>${esc(x.name)}</b><span>${esc(x.note||"Pemasukan tambahan")}</span></div><div class="item-side"><b>${money(x.amount)}</b></div><button class="btn btn-light btn-sm" data-edit="otherIncome" data-id="${x.id}">Edit</button></div>`;
}
function breakdownRows(){
 const rows=[
  ["Pemasukan",totalIncome(),"#0f766e"],
  ["Tabungan",totalSavings(),"#3b82f6"]
 ];
 return rows.map(r=>`<div class="break-row"><b>${r[0]}</b><div class="bar"><i style="width:${Math.min(100,Math.round((r[1]/(totalIncome()||1))*100))}%;background:${r[2]}"></i></div><span>${pct(r[1],totalIncome())}%</span></div>`).join("");
}

function transactionsView(m){
 const all=[
  ...m.otherIncome.map(x=>({...x,_type:"Pemasukan Lain"})),
  ...m.savings.map(x=>({...x,_type:"Tabungan"}))
 ];
 return `<div class="card"><div class="section-title"><div><h2>Semua Pos</h2><small>Kelompokkan pemasukan dan tabungan.</small></div><button class="btn btn-primary" data-action="add-any">＋ Tambah Pos</button></div>
 <div class="tabs"><button class="tab active" data-filter="all">Semua</button><button class="tab" data-filter="income">Pemasukan</button><button class="tab" data-filter="savings">Tabungan</button></div>
 <div id="transactionList">${all.length?all.map(x=>`<div class="item transaction" data-kind="${x._type}"><div class="item-icon" style="background:#eaf6f4">${iconFor(x._type==="Tabungan"?"savings":"income")}</div><div class="item-main"><b>${esc(x.name)}</b><span>${x._type}</span></div><div class="item-side"><b>${money(x.amount)}</b></div></div>`).join(""):`<div class="empty">Belum ada data pada bulan ini.</div>`}</div>
 </div>`;
}

function analysisView(m){
 const inc=totalIncome(), alloc=allocated(), savePct=pct(totalSavings(),inc);
 const remaining=remainingBudget();
 let advice=[];
 if(!inc) advice.push("Masukkan pemasukan utama untuk memulai analisis.");
 else {
   if(remaining>0) advice.push(`Masih ada ${money(remaining)} yang belum dialokasikan.`);
   if(savePct<10) advice.push("Porsi tabungan masih di bawah 10% dari pemasukan bulan ini.");
   if(remaining===0) advice.push("Seluruh pemasukan sudah dialokasikan. Pastikan pos darurat tetap tersedia.");
 }
 return `<div class="grid">
  <div style="display:grid;gap:20px">
   <div class="card"><div class="section-title"><h2>📊 Realisasi Budget</h2><small>${monthLabel(state.activeMonth)}</small></div>
    <div style="display:grid;grid-template-columns:180px 1fr;align-items:center;gap:20px">
      <div class="donut" style="--p:${usedPct()}%"><span>${usedPct()}%</span></div>
      <div class="list">
       <div class="metric"><span>Terpakai</span><div class="big">${money(alloc)}</div><p>dari ${money(inc)} pemasukan</p></div>
       <div class="metric"><span>Sisa</span><div class="big">${money(remaining)}</div><p>belum dialokasikan</p></div>
      </div>
    </div>
   </div>
   <div class="card"><div class="section-title"><h2>Rincian Alokasi</h2></div><div class="breakdown">${breakdownRows()}</div></div>
  </div>
  <div style="display:grid;gap:20px">
   <div class="card"><div class="section-title"><h2>🎯 Analisis Otomatis</h2></div>
    <div class="list">${advice.map((a,i)=>`<div class="item"><div class="item-icon" style="background:${i===0?"#e5f7f4":"#fff3d9"}">${i===0?"💡":"📌"}</div><div class="item-main"><b>${i===0?"Catatan":"Saran"}</b><span>${esc(a)}</span></div></div>`).join("")}</div>
   </div>
  </div>
 </div>`;
}

function settingsView(m){
 return `<div class="grid">
  <div class="card"><div class="section-title"><h2>⚙️ Pengaturan Bulan</h2></div>
   <div class="list">
    <button class="btn btn-light" data-action="add-month">＋ Tambah bulan baru</button>
    <button class="btn btn-light" data-action="copy-month">⧉ Salin data bulan ini ke bulan baru</button>
    <button class="btn btn-danger" data-action="reset">↻ Reset data bulan ini</button>
   </div>
  </div>
  <div class="card"><div class="section-title"><h2>💾 Penyimpanan</h2></div>
   <p class="note">Data tersimpan otomatis di perangkat ini menggunakan localStorage. Tidak perlu menekan tombol simpan setiap kali mengubah data.</p>
   <div class="metric" style="margin-top:14px"><span>Bulan aktif</span><div class="big">${esc(monthLabel(state.activeMonth))}</div><p>${Object.keys(state.months).length} bulan tersimpan</p></div>
  </div>
 </div>`;
}

function render(view=currentView){
 document.getElementById("app").innerHTML=appShell(view);
 bind();
}
let currentView="home";

function bind(){
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render(currentView)});
 const ms=document.getElementById("monthSelect");
 if(ms)ms.onchange=()=>{state.activeMonth=ms.value;save();render(currentView);toast("Bulan aktif diganti")};
 document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>handleAction(b.dataset.action));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit,b.dataset.id));
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
   document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
   const f=b.dataset.filter;
   document.querySelectorAll(".transaction").forEach(x=>{
     const k=x.dataset.kind;
     x.style.display=(f==="all"|| (f==="income"&&k==="Pemasukan Lain") || (f==="savings"&&k==="Tabungan"))?"flex":"none";
   });
 });
}
function handleAction(a){
 if(a==="edit-income")return openEditor("income");
 if(a==="add-savings")return openEditor("savings");
 if(a==="add-other-income")return openEditor("otherIncome");
 if(a==="add-any")return openChooser();
 if(a==="add-month")return addMonth();
 if(a==="copy-month")return copyMonth();
 if(a==="reset")return resetMonth();
}
function openChooser(){
 showModal(`<div class="modal-head"><h2>Tambah Pos</h2><button class="close" data-close>×</button></div><div class="list">
 <button class="btn btn-light" data-choose="otherIncome">💵 Pemasukan Lainnya</button>
 <button class="btn btn-light" data-choose="savings">💰 Tabungan</button></div>`);
 document.querySelectorAll("[data-choose]").forEach(x=>x.onclick=()=>{closeModal();openEditor(x.dataset.choose)});
}
function openEditor(type,id=null){
 const m=month(); let x=null;
 if(type==="income")x={amount:m.income};
 else x=(m[type]||[]).find(y=>y.id===id)||null;
 const isNew=!x;
 const titles={income:"Pemasukan Utama",otherIncome:"Pemasukan Lainnya",savings:"Tambah Tabungan"};
 let body="";
 if(type==="income"){
  body=`<div class="field"><label>Pemasukan Utama</label><input id="fAmount" type="number" min="0" inputmode="numeric" value="${x.amount||""}" placeholder="Rp 0"></div>`;
 }else{
  body=`<div class="form-grid">
   <div class="field full"><label>Nama Pos</label><input id="fName" value="${esc(x?.name||"")}" placeholder="${type==="savings"?"Contoh: Dana Darurat":"Contoh: Bonus / Freelance"}"></div>
   <div class="field"><label>Nominal</label><input id="fAmount" type="text" inputmode="numeric" autocomplete="off" value="${x?.amount??""}" placeholder="Rp 0"></div>
   ${type==="otherIncome"?`<div class="field full"><label>Catatan</label><input id="fNote" value="${esc(x?.note||"")}" placeholder="Contoh: Bonus / Freelance"></div>`:""}
   <div class="field full"><label>Warna</label><div class="color-row">${COLORS.map((c,i)=>`<button type="button" class="color ${(x?.color||COLORS[0])===c?"active":""}" style="background:${c}" data-color="${c}"></button>`).join("")}</div></div>
  </div>`;
 }
 const del=(!isNew&&type!=="income")?`<button class="btn btn-danger" id="deleteBtn">Hapus</button>`:"";
 showModal(`<div class="modal-head"><h2>${titles[type]}</h2><button class="close" data-close>×</button></div>${body}<div class="actions">${del}<button class="btn btn-light" data-close>Batal</button><button type="button" class="btn btn-primary" id="saveBtn">Simpan</button></div>`);
 document.querySelectorAll("[data-color]").forEach(c=>c.onclick=()=>{document.querySelectorAll("[data-color]").forEach(y=>y.classList.remove("active"));c.classList.add("active")});
 const saveBtn=document.getElementById("saveBtn");
 saveBtn.dataset.type=type;
 saveBtn.dataset.id=id||"";
 saveBtn.onclick=()=>{
   try{ saveEditor(saveBtn.dataset.type, saveBtn.dataset.id || null); }
   catch(err){ console.error(err); toast("Gagal menyimpan data. Coba lagi."); }
 };
 if(del)document.getElementById("deleteBtn").onclick=()=>deleteItem(type,id);
}
function saveEditor(type,id){
 const m=month();
 if(type==="income"){
   m.income=num(document.getElementById("fAmount").value);
 }else{
   const name=document.getElementById("fName").value.trim(), amount=num(document.getElementById("fAmount").value);
   if(!name||amount<=0)return toast("Nama dan nominal wajib diisi");
   const obj={id:id||uid(type),name,amount,color:document.querySelector("[data-color].active")?.dataset.color||COLORS[0]};
   if(type==="otherIncome")obj.note=document.getElementById("fNote").value.trim();
   if(!Array.isArray(m[type])) m[type]=[];
   if(id){
     const i=m[type].findIndex(x=>x.id===id);
     if(i>=0)m[type][i]=obj;else m[type].push(obj);
   }else m[type].push(obj);
 }
 save();closeModal();render(currentView);toast("Tersimpan otomatis ✓");
}
function deleteItem(type,id){
 if(!confirm("Hapus pos ini?"))return;
 const m=month();m[type]=m[type].filter(x=>x.id!==id);save();closeModal();render(currentView);toast("Pos dihapus");
}
function addMonth(){
 const d=new Date(state.activeMonth+"-01T00:00:00");d.setMonth(d.getMonth()+1);
 const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
 if(!state.months[iso])state.months[iso]=makeMonth(iso);
 state.activeMonth=iso;save();render(currentView);toast("Bulan baru dibuat");
}
function copyMonth(){
 const d=new Date(state.activeMonth+"-01T00:00:00");d.setMonth(d.getMonth()+1);
 const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
 const src=month();
 state.months[iso]=JSON.parse(JSON.stringify(src));state.months[iso].id=iso;
 state.activeMonth=iso;save();render(currentView);toast("Data disalin ke bulan baru");
}
function resetMonth(){
 if(!confirm("Reset semua data pada bulan ini? Data bulan lain tetap aman."))return;
 state.months[state.activeMonth]=makeMonth(state.activeMonth);save();render(currentView);toast("Bulan berhasil di-reset");
}
function showModal(html){
 const modal=document.getElementById("modal");document.getElementById("modalBox").innerHTML=html;modal.classList.add("open");modal.setAttribute("aria-hidden","false");
 document.querySelectorAll("[data-close]").forEach(x=>x.onclick=closeModal);
}
function closeModal(){const m=document.getElementById("modal");m.classList.remove("open");m.setAttribute("aria-hidden","true")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1800)}
render("home");
})();
</script>
</body>
</html>
